{% extends "base.html" %}

{% block content %}

<div class="flex justify-center items-center min-h-[60vh]">

<div class="bg-gray-800 p-10 rounded-2xl shadow-xl text-center max-w-md">

<div class="text-5xl mb-4">⚠️</div>

<h2 class="text-2xl text-red-400 font-bold mb-4">
Удалить группу {{ group }}?
</h2>

<form method="post" class="flex justify-center gap-4">

{% csrf_token %}

<a href="{% url 'group_list' %}"
   class="bg-gray-600 hover:bg-gray-500 px-5 py-2 rounded-xl transition">
Отмена
</a>

<button class="bg-red-600 hover:bg-red-500 px-6 py-2 rounded-xl transition">
🗑 Удалить
</button>

</form>

</div>

</div>

{% endblock %}
