{% extends 'base.html' %}

{% block content %}
<h1 class="text-2xl font-bold mb-4">👥 Группы</h1>

<a href="{% url 'group_create' %}"
   class="bg-green-500 text-white px-4 py-2 rounded">
   ➕ Добавить группу
</a>

<ul class="mt-4">
  {% for group in groups %}
    <li class="bg-white p-3 rounded shadow mb-2">
      {{ group.name }} — {{ group.faculty }}
    </li>
  {% empty %}
    <li>Групп пока нет</li>
  {% endfor %}
</ul>
{% endblock %}
