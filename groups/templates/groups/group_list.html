{% extends "base.html" %}

{% block content %}

<div class="max-w-6xl mx-auto">

<h1 class="text-3xl font-bold text-indigo-400 mb-8">
    👥 Группы
</h1>

<a href="{% url 'group_create' %}"
   class="bg-green-600 hover:bg-green-500 px-5 py-2 rounded-xl
          transition transform hover:scale-105 inline-block mb-6">
    ➕ Добавить группу
</a>

<div class="bg-gray-800 rounded-2xl shadow-xl overflow-hidden">

<table class="w-full text-left text-gray-300">

<thead class="bg-gray-900 text-gray-400 uppercase text-sm">
<tr>
    <th class="px-6 py-4">Название</th>
    <th class="px-6 py-4">Факультет</th>
</tr>
</thead>

<tbody>

{% for group in groups %}
<tr class="border-t border-gray-700 hover:bg-gray-700 transition">

<td class="px-6 py-4 text-white font-medium">
    {{ group.name }}
</td>

<td class="px-6 py-4 text-indigo-400">
    {{ group.faculty }}
</td>

</tr>

{% empty %}
<tr>
<td colspan="2" class="text-center p-8 text-gray-400">
Групп пока нет 🚀
</td>
</tr>
{% endfor %}

</tbody>
</table>

</div>

</div>

{% endblock %}
