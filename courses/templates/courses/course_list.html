{% extends "base.html" %}

{% block content %}

<div class="max-w-6xl mx-auto">

    <!-- Header -->
    <div class="flex items-center justify-between mb-8">
        <h1 class="text-3xl font-bold text-indigo-400">
            📚 Курсы
        </h1>

        <a href="{% url 'course_create' %}"
           class="bg-green-600 hover:bg-green-500
                  px-5 py-2 rounded-xl
                  font-semibold shadow-lg
                  transition transform hover:scale-105">
            ➕ Добавить курс
        </a>
    </div>

    <!-- Courses Grid -->
    {% if courses %}
        <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">

            {% for course in courses %}
                <div class="bg-gray-800 p-6 rounded-2xl shadow-lg
                            hover:shadow-2xl transition transform hover:-translate-y-1">

                    <h2 class="text-xl font-bold text-white mb-2">
                        {{ course.title }}
                    </h2>

                    <p class="text-gray-400 mb-4">
                        👨‍🏫 {{ course.teacher }}
                    </p>

                    <div class="flex justify-between items-center mt-4">

                        <a href="{% url 'course_update' course.id %}"
                           class="text-indigo-400 hover:text-indigo-300 transition">
                            ✏️ Редактировать
                        </a>

                        <a href="{% url 'course_delete' course.id %}"
                           class="text-red-400 hover:text-red-300 transition">
                            🗑 Удалить
                        </a>

                    </div>

                </div>
            {% endfor %}

        </div>
    {% else %}

        <div class="bg-gray-800 p-10 rounded-2xl text-center shadow-lg">
            <p class="text-gray-400 text-lg">
                Курсов пока нет 🚀
            </p>
        </div>

    {% endif %}

</div>

{% endblock %}
