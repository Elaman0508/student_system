{% extends 'base.html' %}

{% block content %}
<h1 class="text-2xl font-bold mb-4">📚 Курсы</h1>

<a href="{% url 'course_create' %}"
   class="bg-green-500 text-white px-4 py-2 rounded">
   ➕ Добавить курс
</a>

<ul class="mt-4">
  {% for course in courses %}
    <li class="p-2 bg-white shadow mb-2 rounded">
      {{ course.title }} — {{ course.teacher }}
    </li>
  {% empty %}
    <li>Курсов пока нет</li>
  {% endfor %}
</ul>
{% endblock %}
